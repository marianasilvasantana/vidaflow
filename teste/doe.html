<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faça a sua doação</title>
  <link rel="stylesheet" href="doe.css">

</head>
<body>

  <div class="card">
    <h1>Faça a sua doação</h1>

    <form id="form-doacao">
      <div class="input-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>
      </div>

      <div class="input-group">
        <label for="email">e-mail</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label for="valor">valor</label>
        <input type="number" id="valor" min="1" step="any" required>
      </div>

      <div class="input-group">
        <label for="pagamento">Forma de pagamento</label>
        <div class="select-wrapper">
          <select id="pagamento" required>
            <option value="" disabled selected hidden></option>
            <option value="pix">PIX</option>
            <option value="cartao">Cartão de Crédito</option>
            <option value="boleto">Boleto Bancário</option>
          </select>
          <span class="seta">&#10148;</span>
        </div>
      </div>

       <button class="doar">DOAR</button>>

      <button type="button" class="btn-voltar" onclick="history.back()">voltar</button>
    </form>
  </div>

  <script src="doe.js"></script>
</body>
</html>
