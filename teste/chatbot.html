<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidaFlow - Chatbot</title>
  <link rel="stylesheet" href="base.css">
</head>
<body class="chat-layout">

  <!-- BARRA LATERAL -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>VidaFlow Chat</h2>
    </div>
    
    <nav class="sidebar-menu">
      <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
      <a href="#">Nova Conversa</a>
      <a href="#">Configurações</a>
    </nav>
  </aside>

  <!-- ÁREA PRINCIPAL DO CHAT -->
  <div class="chat-main">
    <header class="chat-header">
      <h1>Assistente Virtual</h1>
      <p>Como posso ajudar você hoje?</p>
    </header>

    <!-- ÁREA DAS MENSAGENS -->
    <main class="chat-content" id="chatContent">
      <div class="mensagem bot">
        <p>Olá! Sou o assistente do VidaFlow. Em que posso ajudar?</p>
      </div>
    </main>

    <!-- CAMPO DE DIGITAÇÃO -->
    <footer class="chat-footer">
      <div class="input-group">
        <input type="text" id="userInput" placeholder="Digite sua dúvida aqui...">
        <button type="button" class="btn-enviar" id="btnEnviar">➤</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
