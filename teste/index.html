

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vidaflow</title>
  <link rel="stylesheet" href="base.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>VidaFlow</h1>
    <p>Seu espaço para ajudar pessoas e pedir ajuda.</p>
  </header>

  <main class="card-container">
    
    <article class="card">
      <div class="card-body">
        <h2 class="card-title">Doações</h2>
        <p class="card-text">Aqui você pode doar e pedir doações.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-body">
        <h2 class="card-title">hospitais</h2>
        <p class="card-text">Aqui você vê as informações dos hospitais.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-body">
        <h2 class="card-title">chat bot</h2>
        <p class="card-text">tire duvidas sobre o site.</p>
      </div>
    </article>

  </main>

</body>
</html>
